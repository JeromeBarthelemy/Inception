services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
  wordpress:
    build: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
      - adminer
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
  redis:
    build: ./requirements/bonus/redis
    image: redis:1.0
    container_name: redis
    networks:
      - inception
    restart: always
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:1.0
    container_name: adminer
    networks:
      - inception
    restart: always
  static:
    build: ./requirements/bonus/static
    image: static:1.0
    container_name: static
    networks: [inception]
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jbarthel/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jbarthel/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
