# Foreground: vsftpd must be PID 1 in the container.
background=NO
listen=YES
listen_ipv6=NO

# No anonymous access; one local account, password-authenticated.
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# The user is locked into the WordPress directory.
chroot_local_user=YES
local_root=/var/www/html
# vsftpd refuses to start when the chroot root is writable, which it must be here.
allow_writeable_chroot=YES

# Passive mode: the client opens the data connection to a port we advertise.
# Without pasv_address vsftpd would advertise its internal 172.x address,
# which no client can reach.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21105
pasv_address=127.0.0.1

# Alpine builds vsftpd without PAM, so vsftpd checks the account's shell against
# /etc/shells itself. nobody's shell is /sbin/nologin, which is not listed there
# -- and must not be, since this account must never get a real shell session.
check_shell=NO

# vsftpd's seccomp sandbox misbehaves on musl (500 OOPS: priv_sock_get_cmd).
seccomp_sandbox=NO
# This directory must exist in the image.
secure_chroot_dir=/var/empty
